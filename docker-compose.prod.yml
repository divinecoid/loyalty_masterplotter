# Produksi: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# DB dan API TIDAK dibuka ke internet; hanya Caddy (80/443).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
      POSTGRES_DB: loyalty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PRODUCTION: "true"
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://loyalty:${DB_PASSWORD}@db:5432/loyalty?sslmode=disable
      PUBLIC_URL: https://${DOMAIN:?isi DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET (min 32 karakter acak)}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WA_WEBHOOK_URL: ${WA_WEBHOOK_URL:-}
      WA_WEBHOOK_TOKEN: ${WA_WEBHOOK_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SYNC: ${ADMIN_SYNC:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
