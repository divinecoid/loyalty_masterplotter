# Untuk Dokploy (Traefik yang mengurus domain + HTTPS). Tidak ada port yang dipublikasikan ke host.
# Di Dokploy: Compose > Domains: host = domain kamu, service = web, port = 80, HTTPS = on (Let's Encrypt).
# Variabel (tab Environment): DOMAIN, DB_PASSWORD, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, FONNTE_TOKEN
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
      POSTGRES_DB: loyalty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PRODUCTION: "true"
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://loyalty:${DB_PASSWORD}@db:5432/loyalty?sslmode=disable
      PUBLIC_URL: https://${DOMAIN:?isi DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET (min 32 karakter acak)}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    depends_on:
      - api
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
